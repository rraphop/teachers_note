[package]
name = "teachers_note"
version = "1.0.0"
description = "로컬 AI 교무수첩 (Local Teacher Notebook)"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "teachers_note"
path = "src/main.rs"

[lib]
name = "teachers_note_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.6"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy", "http2"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
thiserror = "2"
regex = "1.13"
once_cell = "1.21"
rust_xlsxwriter = "0.96.0"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
calamine = { version = "0.36.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Data_Xml_Dom",
  "UI_Notifications",
] }

[dev-dependencies]
tempfile = "3.27"
typst-render = "0.15.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
