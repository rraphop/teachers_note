[package]
name = "teachers_note_launcher"
version = "1.0.0"
description = "로컬 AI 교무수첩 — 파일 하나 실행기"
edition = "2024"
rust-version = "1.92"
publish = false

# 바탕화면에 두는 파일 하나. 안에 프로그램 폴더 전체(화면·AI 엔진·라이선스)를 압축해 넣고,
# 켤 때 사용자 데이터 폴더의 program\<버전> 에 풀어(SHA-256 확인) 실행한다.
[[bin]]
name = "teachers_note_launcher"
path = "src/main.rs"

[dependencies]
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-winres = "0.3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
